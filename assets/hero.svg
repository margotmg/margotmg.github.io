<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="hero">
  <defs>
    <linearGradient id="g0" gradientTransform="rotate(0 .5 .5)">
      <stop offset="0" stop-color="#e8e2d2"/>
      <stop offset="1" stop-color="#c3bfb5"/>
    </linearGradient>
    <radialGradient id="r0" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#fcfcfc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fcfcfc" stop-opacity="0"/>
    </radialGradient>
    <filter id="n0" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g0)"/>
  <rect width="1920" height="1080" fill="url(#r0)"/>
  <rect width="1920" height="1080" filter="url(#n0)" opacity=".14" style="mix-blend-mode:multiply"/>
  <g fill="#0d0d0d" fill-opacity=".38" font-family="DM Mono, ui-monospace, monospace" font-size="37" letter-spacing="1.4">
    <text x="106" y="994">HERO</text>
    <text x="1814" y="994" text-anchor="end">1920×1080</text>
  </g>
</svg>
