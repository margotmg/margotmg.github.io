<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-label="about">
  <defs>
    <linearGradient id="g4" gradientTransform="rotate(148 .5 .5)">
      <stop offset="0" stop-color="#a39b84"/>
      <stop offset="1" stop-color="#5d5540"/>
    </linearGradient>
    <radialGradient id="r4" cx="42%" cy="53%" r="70%">
      <stop offset="0" stop-color="#fcfcfc" stop-opacity=".45"/>
